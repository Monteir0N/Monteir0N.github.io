<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dual Player — Portugal</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root { color-scheme: dark; --bg:#101318; --panel:#1a2029; --line:#303a48; --muted:#aab5c4; --accent:#4da3ff; }
    * { box-sizing:border-box }
    body { margin:0; background:var(--bg); color:#f3f6fa; font:14px/1.45 system-ui,Segoe UI,Arial,sans-serif }
    header { padding:16px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap }
    h1 { margin:0; font-size:20px }
    .sub { color:var(--muted); font-size:12px }
    .toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:12px 16px; background:var(--panel); border-bottom:1px solid var(--line) }
    input, select, button { color:#f3f6fa; background:#111720; border:1px solid var(--line); border-radius:8px; padding:9px 11px; font:inherit }
    input { min-width:210px; flex:1 }
    button { cursor:pointer; background:#20364f; border-color:#315b84 }
    button:hover { background:#29496a }
    button:disabled { opacity:.5; cursor:wait }
    #status { color:var(--muted); padding:8px 16px; min-height:34px }
    .players { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:10px; height:calc(100vh - 156px); min-height:360px }
    .player { min-width:0; background:#050607; border:1px solid var(--line); border-radius:10px; overflow:hidden; display:flex; flex-direction:column }
    .player-head { display:flex; justify-content:space-between; gap:8px; align-items:center; padding:9px 11px; background:var(--panel); min-height:42px }
    .player-head strong { overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
    .player-head span { color:var(--muted); font-size:11px; white-space:nowrap }
    video { width:100%; height:100%; min-height:0; flex:1; background:#000; object-fit:contain }
    .hint { color:var(--muted); font-size:12px; padding:0 16px 12px }
    @media(max-width:760px) {
      .players { grid-template-columns:1fr; height:auto }
      .player { min-height:42vh }
      video { min-height:34vh }
    }
  </style>
</head>
<body>
<header>
  <div><h1>Dual Player</h1><div class="sub">Canais do grupo Portugal · ecrã dividido 50/50</div></div>
  <div class="sub" id="count">A carregar canais…</div>
</header>
<section class="toolbar">
  <input id="filter" type="search" placeholder="Pesquisar canal…">
  <select id="channel1" aria-label="Canal do leitor 1"><option value="">Leitor 1 — escolher canal</option></select>
  <button id="play1">Reproduzir 1</button>
  <select id="channel2" aria-label="Canal do leitor 2"><option value="">Leitor 2 — escolher canal</option></select>
  <button id="play2">Reproduzir 2</button>
  <button id="refresh">Atualizar lista</button>
</section>
<div id="status" role="status">A obter catálogo do GEIL.TO…</div>
<main class="players">
  <section class="player">
    <div class="player-head"><strong id="title1">Leitor 1</strong><span>50%</span></div>
    <video id="video1" controls playsinline></video>
  </section>
  <section class="player">
    <div class="player-head"><strong id="title2">Leitor 2</strong><span>50%</span></div>
    <video id="video2" controls playsinline></video>
  </section>
</main>
<p class="hint">A reprodução depende da disponibilidade dos streams, das permissões de acesso e das políticas do servidor de origem.</p>
<script>
(() => {
  "use strict";

  // Os pedidos ao GEIL.TO passam pelo nosso servidor Node.js para evitar CORS no catálogo/resolver.
  const CATALOG_URL = "/api/catalog";

  const els = {
    filter: document.getElementById("filter"),
    channel1: document.getElementById("channel1"),
    channel2: document.getElementById("channel2"),
    play1: document.getElementById("play1"),
    play2: document.getElementById("play2"),
    refresh: document.getElementById("refresh"),
    status: document.getElementById("status"),
    count: document.getElementById("count")
  };

  let channels = [];
  const players = {
    1: { video: document.getElementById("video1"), title: document.getElementById("title1"), hls: null },
    2: { video: document.getElementById("video2"), title: document.getElementById("title2"), hls: null }
  };

  function say(message) { els.status.textContent = message; }

  function getItems(data) {
    if (Array.isArray(data)) return data;
    return data?.items || data?.channels || data?.results || [];
  }

  function channelLabel(ch) {
    return ch.name || ch.title || ch.id || "Canal sem nome";
  }

  function channelId(ch) {
    return ch.id ?? ch.channelId ?? ch._id ?? "";
  }

  async function loadCatalog() {
    say("A obter catálogo do GEIL.TO…");
    els.refresh.disabled = true;
    try {
      const response = await fetch(CATALOG_URL, { cache: "no-store" });
      if (!response.ok) throw new Error(`Servidor local respondeu HTTP ${response.status}`);
      const data = await response.json();
      channels = getItems(data).filter(ch => channelId(ch) !== "");
      if (!channels.length) throw new Error("A resposta foi recebida, mas não encontrei canais no campo items.");
      renderOptions();
      els.count.textContent = `${channels.length} canais`;
      say(`Catálogo carregado: ${channels.length} canais. Escolhe um canal para cada leitor.`);
    } catch (err) {
      say(`Não foi possível carregar o catálogo: ${err.message}. Confirma se iniciaste o servidor com node server.js.`);
      els.count.textContent = "Erro no catálogo";
    } finally {
      els.refresh.disabled = false;
    }
  }

  function renderOptions() {
    const query = els.filter.value.trim().toLocaleLowerCase("pt");
    for (const select of [els.channel1, els.channel2]) {
      const previous = select.value;
      select.replaceChildren(new Option(select === els.channel1 ? "Leitor 1 — escolher canal" : "Leitor 2 — escolher canal", ""));
      channels
        .filter(ch => channelLabel(ch).toLocaleLowerCase("pt").includes(query))
        .sort((a,b) => channelLabel(a).localeCompare(channelLabel(b), "pt"))
        .forEach(ch => {
          const option = new Option(channelLabel(ch), String(channelId(ch)));
          select.add(option);
        });
      if ([...select.options].some(o => o.value === previous)) select.value = previous;
    }
  }

  async function resolveStream(ch) {
    const id = String(channelId(ch));
    const response = await fetch(`/api/resolve?id=${encodeURIComponent(id)}`, { cache: "no-store" });
    if (!response.ok) throw new Error(`Resolver respondeu HTTP ${response.status}`);

    const text = await response.text();
    let data;
    try { data = JSON.parse(text); } catch { data = text.trim(); }

    const candidate = typeof data === "string" ? data :
      data?.url || data?.stream || data?.source?.url ||
      data?.sources?.find(s => s?.url)?.url ||
      data?.result?.url || data?.result;

    if (typeof candidate !== "string" || !/^https?:\/\//i.test(candidate)) {
      throw new Error("O resolver não devolveu um URL de stream reconhecível. Resposta: " + text.slice(0, 250));
    }
    return candidate;
  }

  async function startPlayer(slot) {
    const select = slot === 1 ? els.channel1 : els.channel2;
    const button = slot === 1 ? els.play1 : els.play2;
    const state = players[slot];
    const ch = channels.find(c => String(channelId(c)) === select.value);
    if (!ch) { say(`Escolhe primeiro um canal para o leitor ${slot}.`); return; }

    button.disabled = true;
    say(`A resolver ${channelLabel(ch)}…`);
    try {
      const streamUrl = await resolveStream(ch);
      if (state.hls) { state.hls.destroy(); state.hls = null; }
      state.video.pause();
      state.video.removeAttribute("src");
      state.video.load();

      if (window.Hls && Hls.isSupported() && /\.m3u8($|\?)/i.test(streamUrl)) {
        state.hls = new Hls({ enableWorker: true });
        state.hls.loadSource(streamUrl);
        state.hls.attachMedia(state.video);
        state.hls.on(Hls.Events.MANIFEST_PARSED, () => {
          state.video.play().catch(() => say(`Stream carregado no leitor ${slot}. Carrega em Play se o browser bloquear a reprodução automática.`));
        });
        state.hls.on(Hls.Events.ERROR, (_, data) => {
          if (data.fatal) say(`Erro HLS no leitor ${slot}: ${data.details || data.type}. O servidor do stream pode bloquear CORS.`);
        });
      } else {
        state.video.src = streamUrl;
        await state.video.play();
      }
      state.title.textContent = channelLabel(ch);
      say(`${channelLabel(ch)} carregado no leitor ${slot}.`);
    } catch (err) {
      say(`Falha no leitor ${slot}: ${err.message}`);
    } finally {
      button.disabled = false;
    }
  }

  els.filter.addEventListener("input", renderOptions);
  els.play1.addEventListener("click", () => startPlayer(1));
  els.play2.addEventListener("click", () => startPlayer(2));
  els.refresh.addEventListener("click", loadCatalog);
  loadCatalog();
})();
</script>
</body>
</html>
