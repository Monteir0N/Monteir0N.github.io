<!DOCTYPE html>
<html lang="pt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multiple streams</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:#eee;font-family:system-ui,sans-serif}
header{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;gap:.8rem;align-items:center;padding:.5rem .8rem;background:rgba(17,17,17,.96);border-bottom:1px solid #222;font-size:.9rem;transform:translateY(-100%);transition:transform .2s}
header.show{transform:none}
#tab{position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:4;background:#222;color:#999;border-radius:0 0 8px 8px;padding:0 .9rem;font-size:.7rem;line-height:1.1rem;opacity:.45;cursor:pointer;user-select:none}
#tab:hover{opacity:1}
header h1{font-size:1rem;margin:0;flex:1}
header a{color:#9bd;text-decoration:none;padding:.2rem .6rem;border-radius:6px;background:#1b1b1b}
header a.on{background:#2a4a7a;color:#fff}
#grid{display:grid;gap:4px;padding:4px;grid-template-columns:1fr 1fr}
#grid.n2{grid-template-columns:1fr 1fr}
#grid.n1{grid-template-columns:1fr}
@media (max-width:700px){#grid.n2{grid-template-columns:1fr}}
.tile{position:relative;background:#0b0b0b;aspect-ratio:16/9;overflow:hidden;border-radius:4px;cursor:pointer}
.tile video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.tile .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#777;font-size:1rem;pointer-events:none}
.tile.has .empty{display:none}
.tile .status{position:absolute;top:6px;left:8px;right:8px;font-size:.75rem;text-shadow:0 0 4px #000;pointer-events:none}
.status.ok{color:#9f9}.status.err{color:#f99}.status.info{color:#bbb}
.tb{position:absolute;left:0;right:0;bottom:0;display:none;gap:.3rem;align-items:center;padding:.3rem .5rem;background:linear-gradient(transparent,rgba(0,0,0,.85));cursor:default}
.tile.has .tb{display:flex}
.tb .nm{flex:1;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb button{background:#2a2a2a;color:#fff;border:0;border-radius:5px;padding:.25rem .5rem;cursor:pointer;font-size:.8rem}
.tb button.src.on{background:#2d5a3d;outline:1px solid #9f9}
.tb button.src.bad{background:#3a2222;color:#c88;text-decoration:line-through}
#pk{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:10}
#pk.on{display:flex}
#pk .box{background:#161616;border-radius:8px;width:min(460px,92vw);max-height:80vh;display:flex;flex-direction:column;padding:.8rem;gap:.6rem}
#pk h2{margin:0;font-size:1rem}
#q{width:100%;padding:.55rem .7rem;border-radius:6px;border:1px solid #333;background:#0f0f0f;color:#eee;font-size:1rem}
#list{overflow:auto;display:flex;flex-direction:column;gap:2px}
#list button{display:flex;justify-content:space-between;gap:1rem;text-align:left;background:#1d1d1d;color:#eee;border:0;padding:.5rem .7rem;border-radius:5px;cursor:pointer;font-size:.95rem}
#list button:hover{background:#2a4a7a}
#list small{color:#888}
#list p{color:#888;margin:.5rem}
#ab{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:11}
#ab.on{display:flex}
#ab .box{background:#161616;border-radius:8px;width:min(620px,94vw);max-height:86vh;overflow:auto;padding:1rem 1.2rem;line-height:1.5;font-size:.92rem}
#ab h2{margin:.2rem 0 .6rem;font-size:1.1rem}
#ab h3{margin:1rem 0 .3rem;font-size:.95rem;color:#9bd}
#ab code{background:#0f0f0f;border:1px solid #2a2a2a;border-radius:4px;padding:0 .35rem;color:#9f9;word-break:break-all}
#ab ul{margin:.3rem 0;padding-left:1.2rem}
#ab a{color:#9bd;word-break:break-all}
#ab .close{float:right;background:#2a4a7a;color:#fff;border:0;border-radius:6px;padding:.3rem .8rem;cursor:pointer}
</style></head><body>
<header>
  <h1>Multiple streams</h1>
  <a href="?s-num=1" id="l1">1 player</a>
  <a href="?s-num=2" id="l2">2 players</a>
  <a href="?s-num=4" id="l4">4 players</a>
  <a href="football-streams.html">⚽ Jogos</a>
  <a href="#" id="fsbtn">⛶ Ecrã inteiro</a>
  <a href="#" id="about">ℹ Sobre</a>
</header>
<div id="tab">▾ menu</div>
<div id="grid"></div>

<div id="pk">
  <div class="box">
    <h2 id="pkt">Escolher canal</h2>
    <input id="q" type="search" placeholder="Pesquisar canal…" autocomplete="off">
    <div id="list"></div>
  </div>
</div>

<div id="ab">
  <div class="box" id="abbox"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<script>
const PLAYLIST_URL = "https://vavoo-m3u.monteiro-n.workers.dev/playlist.m3u?country=Portugal";
const SOURCE_TIMEOUT_MS = 15000;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- ?s-num=2|4 ---------- */
// ?s-num=2&ch1=sporttv1&ch2=sporttv2 ...  (ch1..ch4 = canal a abrir em cada player)
const PARAMS = new URLSearchParams(location.search);
const sNum = (() => {
  const n = parseInt(PARAMS.get("s-num"), 10);
  if ([1, 2, 4].includes(n)) return n;
  // sem s-num: deduz o nº de players a partir do maior chN indicado
  let max = 1;
  for (let i = 1; i <= 4; i++) if (PARAMS.get("ch" + i)) max = i;
  return max <= 1 ? 1 : max === 2 ? 2 : 4;
})();
$("grid").className = "n" + sNum;

// links do menu mantêm os ch1..ch4 atuais e só mudam o s-num
function refreshLinks() {
  const cur = new URLSearchParams(location.search);
  for (const n of [1, 2, 4]) {
    const p = new URLSearchParams(cur);
    p.set("s-num", n);
    $("l" + n).href = "?" + p.toString();
    $("l" + n).classList.toggle("on", n === sNum);
  }
}
refreshLinks();

// guarda a escolha no endereço (para favoritos / partilhar); ignora erros (ex.: file://)
function setChParam(i, key) {
  try {
    const u = new URL(location.href);
    u.searchParams.set("s-num", sNum);
    if (key) u.searchParams.set("ch" + (i + 1), key);
    else u.searchParams.delete("ch" + (i + 1));
    history.replaceState(null, "", u);
    refreshLinks();
  } catch (_) {}
}

/* ---------- menu que se esconde ---------- */
const hdr = document.querySelector("header");
let hideT = null;
const showHdr = () => { clearTimeout(hideT); hdr.classList.add("show"); };
const hideHdr = (ms = 800) => { clearTimeout(hideT); hideT = setTimeout(() => hdr.classList.remove("show"), ms); };
document.addEventListener("mousemove", e => {
  if (e.clientY <= 40) showHdr();
  else if (!hdr.matches(":hover")) hideHdr();
});
hdr.addEventListener("mouseenter", showHdr);
hdr.addEventListener("mouseleave", () => hideHdr(400));
$("tab").addEventListener("click", () => {            // toque / clique (telemóvel)
  if (hdr.classList.contains("show")) hdr.classList.remove("show");
  else { showHdr(); hideHdr(5000); }
});

/* ---------- playlist -> canais ---------- */
const NOISE = new Set(["hd","fhd","uhd","sd","4k","pt","portugal","raw","backup","hevc","h265","1080p","720p"]);
const norm = s => String(s).toLowerCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .replace(/\(\s*\d+\s*\)/g, " ")
  .replace(/\+/g, " plus ")
  .replace(/[^a-z0-9]+/g, " ").trim().split(" ")
  .filter(w => w && !NOISE.has(w)).join("");

const cleanName = n => n
  .replace(/\(\s*\d+\s*\)/g, "").replace(/\(\s*backup\s*\)/ig, "")
  .replace(/\b(f?hd|uhd|sd)\b/ig, "").replace(/\s+/g, " ").trim();

function parseM3u(text) {
  const out = [];
  let name = null;
  for (const line of text.split(/\r?\n/)) {
    if (line.startsWith("#EXTINF")) name = line.slice(line.lastIndexOf(",") + 1).trim();
    else if (line && !line.startsWith("#") && name) { out.push({name, url: line.trim()}); name = null; }
  }
  return out;
}

let CHANNELS = []; // [{key, name, sources:[{name,url}]}]
async function loadPlaylist() {
  const res = await fetch(PLAYLIST_URL);
  if (!res.ok) throw new Error("HTTP " + res.status);
  const map = new Map();
  for (const e of parseM3u(await res.text())) {
    const key = norm(e.name);
    if (!key) continue;
    if (!map.has(key)) map.set(key, {key, name: cleanName(e.name) || e.name, sources: []});
    map.get(key).sources.push(e);
  }
  CHANNELS = [...map.values()];
  for (const c of CHANNELS) // backups last (stable sort)
    c.sources.sort((a, b) => /backup/i.test(a.name) - /backup/i.test(b.name));
  CHANNELS.sort((a, b) => a.name.localeCompare(b.name, "pt", {numeric: true}));
}

/* ---------- players ---------- */
const slots = [];

function makeSlot(i) {
  const el = document.createElement("div");
  el.className = "tile";
  el.innerHTML = `
    <video playsinline muted autoplay></video>
    <div class="empty">Clique para escolher um canal</div>
    <div class="status info"></div>
    <div class="tb">
      <span class="nm"></span>
      <span class="srcs"></span>
      <button class="mute" title="Som">🔇</button>
      <button class="fs" title="Ecrã inteiro">⛶</button>
      <button class="chg" title="Mudar de canal">⇄</button>
      <button class="stp" title="Parar">✕</button>
    </div>`;
  $("grid").appendChild(el);

  const s = {
    i, el, video: el.querySelector("video"),
    status: el.querySelector(".status"), nm: el.querySelector(".nm"),
    srcsEl: el.querySelector(".srcs"), muteBtn: el.querySelector(".mute"),
    hls: null, timer: null, token: 0,
    channel: null, idx: 0, failed: new Set()
  };

  el.addEventListener("click", e => {
    if (e.target.closest(".tb")) return;
    openPicker(s);
  });
  el.querySelector(".srcs").addEventListener("click", e => {
    const b = e.target.closest("button.src");
    if (b) { s.failed.delete(+b.dataset.i); tryPlay(s, +b.dataset.i); }
  });
  s.muteBtn.onclick = () => toggleMute(s);
  el.querySelector(".fs").onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else el.requestFullscreen?.();
  };
  el.querySelector(".chg").onclick = () => openPicker(s);
  el.querySelector(".stp").onclick = () => stopSlot(s, true);
  return s;
}

function setStatus(s, text, kind) { s.status.textContent = text; s.status.className = "status " + (kind || "info"); }

function renderSrcs(s) {
  const list = s.channel?.sources || [];
  s.srcsEl.innerHTML = list.length < 2 ? "" : list.map((src, i) =>
    `<button class="src${i === s.idx ? " on" : ""}${s.failed.has(i) ? " bad" : ""}" data-i="${i}" title="${esc(src.name)}">${i + 1}</button>`
  ).join("");
}

function toggleMute(s) {
  const willUnmute = s.video.muted;
  for (const o of slots) { o.video.muted = true; o.muteBtn.textContent = "🔇"; } // só um com som
  if (willUnmute) { s.video.muted = false; s.muteBtn.textContent = "🔊"; }
}

function teardown(s) {
  clearTimeout(s.timer);
  if (s.hls) { s.hls.destroy(); s.hls = null; }
  s.video.onplaying = null; s.video.onerror = null;
  s.video.pause(); s.video.removeAttribute("src"); s.video.load();
}

function stopSlot(s, clear) {
  s.token++;
  teardown(s);
  if (clear) {
    setChParam(s.i, null);
    s.channel = null; s.failed = new Set();
    s.el.classList.remove("has");
    s.muteBtn.textContent = "🔇"; s.video.muted = true;
    setStatus(s, "", "info");
  }
}

function playChannel(s, channel) {
  setChParam(s.i, channel.key);
  s.channel = channel;
  s.failed = new Set();
  s.nm.textContent = channel.name;
  s.el.classList.add("has");
  tryPlay(s, 0);
}

// tenta a fonte i; se falhar passa sozinho à seguinte (sem voltar atrás)
function tryPlay(s, i) {
  teardown(s);
  s.idx = i;
  const my = ++s.token;
  const src = s.channel.sources[i];
  renderSrcs(s);
  setStatus(s, `A tentar fonte ${i + 1}/${s.channel.sources.length}…`, "info");

  const fail = () => {
    if (my !== s.token) return;
    teardown(s);
    s.failed.add(i);
    const next = s.channel.sources.findIndex((_, j) => j > i && !s.failed.has(j));
    if (next !== -1) { tryPlay(s, next); return; }
    renderSrcs(s);
    setStatus(s, "Nenhuma fonte funcionou (bloqueio CORS?).", "err");
  };
  const ok = () => {
    if (my !== s.token) return;
    clearTimeout(s.timer);
    setStatus(s, "", "ok");
  };

  const v = s.video;
  v.onplaying = ok;
  s.timer = setTimeout(fail, SOURCE_TIMEOUT_MS);

  if (v.canPlayType("application/vnd.apple.mpegurl")) {
    v.onerror = fail;
    v.src = src.url;
    v.play().catch(() => {});
  } else if (window.Hls && Hls.isSupported()) {
    s.hls = new Hls();
    s.hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) fail(); });
    s.hls.loadSource(src.url);
    s.hls.attachMedia(v);
    v.play().catch(() => {});
  } else {
    clearTimeout(s.timer);
    setStatus(s, "Este browser não suporta HLS.", "err");
  }
}

/* ---------- seletor de canais ---------- */
let pickerSlot = null;

function renderList() {
  const q = $("q").value.trim().toLowerCase();
  const qn = norm(q);
  const items = CHANNELS.filter(c => !q || c.name.toLowerCase().includes(q) || (qn && c.key.includes(qn)));
  $("list").innerHTML = items.length
    ? items.map(c => `<button data-k="${esc(c.key)}">${esc(c.name)}<small>${c.sources.length > 1 ? c.sources.length + " fontes" : ""}</small></button>`).join("")
    : "<p>Nenhum canal encontrado.</p>";
}

function openPicker(s) {
  pickerSlot = s;
  $("pkt").textContent = `Player ${s.i + 1} — escolher canal`;
  $("q").value = "";
  renderList();
  $("pk").classList.add("on");
  $("q").focus();
}
function closePicker() { $("pk").classList.remove("on"); pickerSlot = null; }

$("q").addEventListener("input", renderList);
$("pk").addEventListener("click", e => {
  if (e.target === $("pk")) return closePicker();
  const b = e.target.closest("button[data-k]");
  if (!b || !pickerSlot) return;
  const ch = CHANNELS.find(c => c.key === b.dataset.k);
  const s = pickerSlot;
  closePicker();
  if (ch) playChannel(s, ch);
});
document.addEventListener("keydown", e => { if (e.key === "Escape") { closePicker(); closeAbout(); } });

/* ---------- ecrã inteiro da página ---------- */
const fsBtn = $("fsbtn");
function togglePageFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.().catch(() => {});
}
if (!document.fullscreenEnabled) fsBtn.style.display = "none"; // ex.: iPhone
fsBtn.addEventListener("click", e => { e.preventDefault(); togglePageFullscreen(); });
document.addEventListener("fullscreenchange", () => {
  fsBtn.textContent = document.fullscreenElement ? "⛶ Sair do ecrã inteiro" : "⛶ Ecrã inteiro";
});
document.addEventListener("keydown", e => {
  if (e.key.toLowerCase() !== "f" || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target.closest("input, textarea")) return; // não interferir com a pesquisa
  togglePageFullscreen();
});

/* ---------- sobre ---------- */
function buildAbout() {
  const base = location.protocol === "file:"
    ? (location.pathname.split("/").pop() || "multiple-streams.html")
    : location.origin + location.pathname;
  const ex = q => `<a href="?${q}"><code>${esc(base)}?${esc(q)}</code></a>`;
  $("abbox").innerHTML = `
    <button class="close" id="abclose">Fechar</button>
    <h2>Como funciona o endereço</h2>
    <p>Os parâmetros no fim do endereço (depois do <code>?</code>) dizem à página quantos players mostrar e que canal abrir em cada um. Separa os parâmetros com <code>&amp;</code>.</p>

    <h3>Número de players — <code>s-num</code></h3>
    <ul>
      <li><code>s-num=1</code> — um player (é o valor por omissão)</li>
      <li><code>s-num=2</code> — dois players lado a lado (um por cima do outro em ecrãs estreitos)</li>
      <li><code>s-num=4</code> — quatro players em grelha 2×2</li>
    </ul>

    <h3>Canais — <code>ch1</code> a <code>ch4</code></h3>
    <p><code>ch1</code> é o primeiro player, <code>ch2</code> o segundo, e assim por diante. Cada um leva o <code>=</code> e o nome do canal, por exemplo <code>ch1=sporttv1</code>.</p>
    <ul>
      <li>O nome não distingue maiúsculas, espaços, pontos nem HD/PT: <code>sporttv1</code>, <code>SPORT TV 1</code> e <code>Sport.Tv1</code> são iguais.</li>
      <li>Se o canal não existir na playlist, o player mostra um aviso.</li>
      <li>Os canais abrem sem som (os browsers bloqueiam o som automático). Usa o botão 🔊 do player para ouvir; só um player tem som de cada vez.</li>
      <li>Se não indicares <code>s-num</code> mas indicares canais, o número de players é deduzido do maior <code>chN</code> (<code>ch2</code> → 2 players, <code>ch3</code> ou <code>ch4</code> → 4).</li>
    </ul>

    <h3>Exemplos</h3>
    <ul>
      <li>${ex("s-num=2&ch1=sporttv1&ch2=sporttv2")}</li>
      <li>${ex("s-num=4&ch1=sporttv1&ch2=sporttv2&ch3=dazn1&ch4=rtp1")}</li>
      <li>${ex("ch1=sporttv1")}</li>
    </ul>

    <h3>Dicas</h3>
    <ul>
      <li>Clica num player para escolher o canal. A escolha fica guardada no endereço, por isso podes pôr a página nos favoritos ou enviar o link com a mesma disposição.</li>
      <li>Os links "1 player", "2 players" e "4 players" mudam só o número de players e mantêm os canais já escolhidos.</li>
      <li>Ecrã inteiro: usa o botão "⛶ Ecrã inteiro" no menu ou carrega na tecla <code>F</code> (não precisas do F11). Por segurança, os browsers só permitem entrar em ecrã inteiro depois de um clique ou tecla, por isso não pode abrir assim automaticamente a partir do endereço. Para sair, carrega em Esc.</li>
      <li>Este menu esconde-se sozinho: aproxima o rato do topo da página (ou toca em "▾ menu" no telemóvel) para o mostrar.</li>
    </ul>`;
  $("abclose").onclick = closeAbout;
}
function openAbout() { buildAbout(); $("ab").classList.add("on"); }
function closeAbout() { $("ab").classList.remove("on"); }
$("about").addEventListener("click", e => { e.preventDefault(); openAbout(); });
$("ab").addEventListener("click", e => { if (e.target === $("ab")) closeAbout(); });

/* ---------- arranque ---------- */
for (let i = 0; i < sNum; i++) slots.push(makeSlot(i));

function findChannel(v) {
  const k = norm(v);
  return CHANNELS.find(c => c.key === k) ||
         CHANNELS.find(c => c.name.toLowerCase() === String(v).toLowerCase());
}

function autoOpen() {
  slots.forEach((s, i) => {
    const v = PARAMS.get("ch" + (i + 1));
    if (!v) return;
    const c = findChannel(v);
    if (c) playChannel(s, c);
    else setStatus(s, `Canal "${v}" não encontrado na playlist.`, "err");
  });
}

loadPlaylist().then(autoOpen).catch(err => {
  console.warn("Playlist indisponível:", err.message);
  for (const s of slots) s.el.querySelector(".empty").textContent = "Playlist indisponível: " + err.message;
});
</script>
</body></html>
